oracle_ask:
  _target_                     : 'habitat_llm.tools.motor_skills.MotorSkillTool'
  _recursive_                  : False

  skill_config                  :
    skill                      :
      _target_                 : "habitat_llm.tools.motor_skills.OracleAskSkill"
      _partial_                : True

    name                       : 'Ask'
    description                : 'Used to ask the user a question when you need information you do not know. Example (Ask[I do not know how to [clean] this. Do you know how?])'

    max_skill_steps            : 10
    at_resting_threshold       : 0.15
    force_end_on_timeout       : True

    max_dis_interact_art       : 2.0

    enable_exploration         : False
